<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <style>
    body { font-family: sans-serif; padding: 15px; background: #f4f4f9; }
    .card { background: white; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 15px; }
    h3 { margin-top: 0; color: #2c3e50; font-size: 16px; border-bottom: 2px solid #3498db; padding-bottom: 5px; }
    label { font-size: 12px; font-weight: bold; color: #7f8c8d; }
    input, select, button { width: 100%; padding: 10px; margin: 8px 0; border-radius: 4px; border: 1px solid #ddd; box-sizing: border-box; }
    .btn-add { background: #27ae60; color: white; border: none; cursor: pointer; }
    .btn-update { background: #2980b9; color: white; border: none; cursor: pointer; }
    .btn-remove { background: #c0392b; color: white; border: none; cursor: pointer; }
    #status { padding: 10px; border-radius: 4px; font-size: 12px; text-align: center; display: none; }
  </style>
</head>
<body>

  <div class="card">
    <h3>📦 Item Manager</h3>
    
    <label>Create Room:</label>
    <input type="text" id="roomName" placeholder="e.g., Room 301">

    <label>Target Room:</label>
      <select id="room">
        <option value="Room 301">Room 301</option>
        <option value="Room 302">Room 302</option>
        <option value="Room 303">Room 303</option>
        <option value="Room 304">Room 304</option>
      </select>


    <label>CATEGORY</label>
    <select id="type">
      <option value="Equipment">Equipment </option>
      <option value="Consumables">Consumables </option>
    </select>
    
    <label>ITEM NAME</label>
    <input type="text" id="itemName" placeholder="e.g., Stethoscope">
    
    <label>STOCK QUANTITY</label>
    <input type="number" id="itemStock" placeholder="Enter number">

      <div id="extraFieldArea">
        <label id="extraLabel">Shelf:</label>
        <input type="text" id="extraValue" placeholder="e.g. Shelf A-1">
      </div>
    
    <button class="btn-add" onclick="run('add')">ADD NEW ITEM</button>
    <button class="btn-update" onclick="run('update')">UPDATE STOCK LEVEL</button>
    <button class="btn-remove" onclick="run('remove')">REMOVE ITEM</button>
  </div>

  <div id="status"></div>

<script>
  // This listener changes the label from "Shelf" to "Unit" based on selection
  document.getElementById('type').addEventListener('change', function() {
    var label = this.value === 'Equipment' ? 'Shelf:' : 'Unit:';
    document.getElementById('extraLabel').innerText = label;
  });

function run(action) {
  const status = document.getElementById('status');
  const stockInput = document.getElementById('itemStock').value; // Get stock value
  
  const data = {
    room: document.getElementById('room').value,
    type: document.getElementById('type').value,
    name: document.getElementById('itemName').value,
    stock: stockInput,
    shelf: document.getElementById('extraValue').value,
    unit: document.getElementById('extraValue').value
  };

  // ERROR PREVENTION: Check for Item Name
  if (!data.name) {
    alert("⚠️ Please enter an Item Name.");
    return;
  }

  // ERROR PREVENTION: Check for empty Stock on Add or Update
  if ((action === 'add' || action === 'update') && stockInput === "") {
    alert("⚠️ Please enter a Stock Quantity.");
    return;
  }

  status.style.display = "block";
  status.style.background = "#eee";
  status.innerText = "Processing...";

    // Send directly to the .gs function
    google.script.run
      .withSuccessHandler(msg => {
        status.innerText = msg;
        status.style.background = msg.includes('✅') ? "#d4edda" : "#f8d7da";
        if (msg.includes('✅')) {
          document.getElementById('itemName').value = "";
          document.getElementById('itemStock').value = "";
          document.getElementById('extraValue').value = "";
        }
      })
      .modifyInventory(action, data);
  }
</script>
</body>
</html>
